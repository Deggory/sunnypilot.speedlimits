<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
__NNSLR_THEME__
<title>Speed limits · Overview</title>
<style>
__NNSLR_SHARED_CSS__
/* Overview, Prepare, Train, Evaluate: one page, a tab each (web/src/pages/control.ts, web/src/control/ControlApp.vue). */
.live.off{color:var(--bad)}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.banner{margin:0;padding:12px 16px;border-radius:14px;background:var(--warn-soft);color:var(--fg);border:1px solid var(--warn)}
.page>*{animation:tab-in .22s ease-out}
@keyframes tab-in{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.page>section{min-width:0}
/* Prepare, Train: work running goes first, under the title; the last finished job stays at the bottom. */
.page>.banner{order:-3}.page>.page-head{order:-2}.page>.live-section.now{order:-1}
/* A tab with work running: a pulsing dot on its link in the top bar. */
.tabs a[data-busy="true"]::after{content:"";width:7px;height:7px;margin-left:8px;border-radius:50%;background:var(--rev);flex:none;
animation:pulse 1.2s infinite}
.section-title{display:flex;align-items:center;gap:8px;margin:4px 2px 10px;font-size:13px;font-weight:600;letter-spacing:.05em;
text-transform:uppercase;color:var(--muted)}
.count-badge{min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--rev-soft);color:var(--rev);font-size:12px;
letter-spacing:0;display:inline-grid;place-items:center;font-variant-numeric:tabular-nums}
.live-section{display:flex;flex-direction:column;gap:12px}
.live-section>.section-title{margin-bottom:-2px}
.jp-list{display:flex;flex-direction:column;gap:12px}
.side{display:flex;flex-direction:column;gap:14px;min-width:0}
/* Disabled buttons stay legible (flat, muted text): the reason next to them explains why. */
.hero .btn:disabled,.side .btn:disabled{opacity:1;background:transparent;border-color:var(--line);color:var(--muted)}
.hero .btn.primary:disabled{background:var(--accent-soft);border-color:var(--tab-on-ring);color:var(--tab-on-fg)}
.reason{margin:0}

/* Colour of a phase: blue review (an action), amber prepare (machine work waiting), green train / done. */
.k-review{--k:var(--rev);--k-soft:var(--rev-soft)}
.k-prepare{--k:var(--todo);--k-soft:var(--todo-soft)}
.k-train,.k-done{--k:var(--ok);--k-soft:var(--ok-soft)}

/* Next step: a soft wash in the phase's colour and a coloured eyebrow. */
.hero{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px 28px;align-items:center;
background:linear-gradient(100deg,var(--k-soft,transparent),transparent 72%),var(--card-grad),var(--surface);
border-color:color-mix(in srgb,var(--k,var(--line)) 40%,transparent)}
.hero .kicker{display:inline-flex;align-items:center;gap:8px;margin:0 0 6px;color:var(--k,var(--muted))}
.hero .kicker::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.hero .title{font-size:22px;line-height:1.2;font-weight:700;letter-spacing:-.015em}
.hero .text{margin-top:4px;color:var(--muted);max-width:70ch}
.hero .text:empty{display:none}
.hero .actions{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.hero .actions:empty{display:none}

/* The three phases at a glance (Overview): Prepare and Train link to their tab, the review is a card. */
.flow{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.flow-tile{display:flex;flex-direction:column;gap:6px;min-width:0;padding:16px 18px;border-radius:18px;color:inherit;text-decoration:none;
background:var(--card-grad),var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);transition:border-color .2s,background .2s}
.flow-tile:hover{border-color:var(--hover-line);background:var(--card-grad),var(--surface-2)}
.flow-tile.attention{border-color:color-mix(in srgb,var(--k) 55%,transparent);box-shadow:0 0 0 3px var(--k-soft),var(--shadow)}
.flow-head{display:flex;align-items:center;gap:10px;font-size:13px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.flow-head::after{content:"→";margin-left:auto;letter-spacing:0;font-size:15px;opacity:.6;transition:transform .2s}
.flow-tile:hover .flow-head::after{transform:translateX(3px);opacity:1}
.flow-num{width:24px;height:24px;border-radius:50%;flex:none;display:grid;place-items:center;background:var(--surface-2);
border:1px solid var(--line-strong);color:var(--muted);font-size:12px;font-weight:700;letter-spacing:0}
.flow-tile.attention .flow-num{background:var(--k-soft);border-color:var(--k);color:var(--k)}
.flow-busy{display:inline-flex;align-items:center;gap:6px;padding:2px 9px;border-radius:999px;background:var(--rev-soft);color:var(--rev);
font-size:12px;letter-spacing:0;text-transform:none}
.flow-busy::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;animation:pulse 1.2s infinite}
.flow-big{font-size:22px;line-height:1.2;font-weight:700;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.flow-note{font-size:13px;color:var(--muted)}
.flow-tile .bar{margin:2px 0}

/* Nothing running: a calm card. */
.idle{display:flex;align-items:center;gap:14px}
.idle-icon{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;flex:none;background:var(--ok-soft);color:var(--ok)}
.idle-icon svg{width:24px;height:24px}
.idle.waiting .idle-icon{background:var(--surface-2);color:var(--muted)}
.idle-text{display:flex;flex-direction:column;gap:2px;min-width:0}
.idle-text strong{font-size:16px}
.idle-text span{color:var(--muted);font-size:13.5px}

/* A job, live (JobProgress.vue): head, big percent, bar, what it is doing, the steps on the right. */
.jp{position:relative;overflow:hidden;display:flex;flex-direction:column;gap:16px;min-width:0;padding:18px 20px;border-radius:20px;
background:var(--card-grad),var(--surface);border:1px solid var(--line);box-shadow:var(--shadow)}
.jp-running{border-color:color-mix(in srgb,var(--rev) 38%,var(--line))}
.jp-running::before{content:"";position:absolute;left:0;right:0;top:0;height:2px;
background:linear-gradient(90deg,transparent,var(--rev),transparent);background-size:50% 100%;background-repeat:no-repeat;
animation:jp-scan 2.6s linear infinite}
@keyframes jp-scan{from{background-position:-100% 0}to{background-position:200% 0}}
.jp-failed{border-color:color-mix(in srgb,var(--bad) 38%,var(--line))}
.jp-interrupted{border-color:color-mix(in srgb,var(--warn) 32%,var(--line))}
.jp-head{display:flex;align-items:center;gap:12px;min-width:0}
.jp-icon{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;flex:none;background:var(--surface-2);color:var(--muted)}
.jp-icon.run{background:var(--rev-soft);color:var(--rev)}
.jp-icon.ok{background:var(--ok-soft);color:var(--ok)}
.jp-icon.bad{background:var(--bad-soft);color:var(--bad)}
.jp-icon.warn{background:var(--warn-soft);color:var(--warn)}
.jp-icon svg{width:18px;height:18px}
.jp-icon .spinner{width:18px;height:18px}
.jp-title{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.jp-title h3{margin:0;font-size:17px;font-weight:700;letter-spacing:-.01em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.jp-kicker{font-size:11.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.jp-when{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.jp-body{display:grid;grid-template-columns:minmax(0,1fr);gap:18px 28px;align-items:start}
.jp.has-steps .jp-body{grid-template-columns:minmax(0,1fr) minmax(250px,320px)}
.jp-main{display:flex;flex-direction:column;gap:10px;min-width:0}
.jp-figure{display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 16px}
.jp-big{font-size:46px;font-weight:750;letter-spacing:-.035em;line-height:1;font-variant-numeric:tabular-nums}
.jp-big small{margin-left:2px;font-size:22px;font-weight:650;letter-spacing:-.01em;color:var(--muted)}
.jp-big-word{font-size:28px;letter-spacing:-.02em;line-height:1.1}
.jp-running .jp-big-word{color:var(--rev)}
.jp-big-word.ok{color:var(--ok)}.jp-big-word.bad{color:var(--bad)}.jp-big-word.warn{color:var(--warn)}
.jp-eta{font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.jp-bar{position:relative;height:10px;border-radius:5px;background:var(--surface-3);overflow:hidden}
.jp-bar span{position:relative;display:block;height:100%;width:0;border-radius:5px;overflow:hidden;
background:linear-gradient(90deg,var(--accent),var(--rev));transition:width .8s cubic-bezier(.2,.8,.2,1)}
.jp-running .jp-bar:not(.indeterminate) span::after{content:"";position:absolute;inset:0;
background:linear-gradient(90deg,transparent,rgba(255,255,255,.35),transparent);transform:translateX(-100%);animation:jp-shine 2s ease-in-out infinite}
@keyframes jp-shine{to{transform:translateX(100%)}}
.jp-bar.ok span{background:var(--ok)}.jp-bar.bad span{background:var(--bad)}.jp-bar.warn span{background:var(--warn)}
.jp-bar.indeterminate span{position:absolute;width:35%;animation:live-slide 1.4s ease-in-out infinite}
@keyframes live-slide{0%{left:-35%}100%{left:100%}}
.jp-detail{margin:0;font-size:15px;font-weight:650;font-variant-numeric:tabular-nums}
.jp-stopped{margin:0;color:var(--bad);font-size:14px}
.jp-line{margin:0;color:var(--muted);font-size:13.5px;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;line-clamp:2;
-webkit-box-orient:vertical;overflow:hidden}
.jp-line.bad{color:var(--fg)}
.jp-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
.jp-actions .btn{min-width:104px}
.jp-terminal{border-style:dashed}
.spinner{width:16px;height:16px;border-radius:50%;border:2.5px solid var(--line-strong);border-top-color:var(--rev);flex:none;
animation:live-spin .8s linear infinite}
@keyframes live-spin{to{transform:rotate(360deg)}}

/* The steps of a job (JobSteps.vue): a vertical timeline, done green with a check, current blue and pulsing. */
.jp-steps{list-style:none;margin:0;padding:12px 14px;border-radius:16px;background:var(--surface-2);border:1px solid var(--line);
display:flex;flex-direction:column}
.jp-steps li{position:relative;display:flex;align-items:flex-start;gap:10px;padding:5px 0;font-size:13.5px;color:var(--muted)}
.jp-steps li::after{content:"";position:absolute;left:10px;top:29px;bottom:-5px;width:2px;border-radius:1px;background:var(--line-strong)}
.jp-steps li:last-child::after{display:none}
.jp-steps li.done::after{background:var(--ok)}
.jp-mark{position:relative;z-index:1;width:22px;height:22px;border-radius:50%;flex:none;display:grid;place-items:center;
border:1.5px solid var(--line-strong);background:var(--surface);color:var(--muted);font-size:11px;font-weight:700;font-variant-numeric:tabular-nums}
.jp-mark svg{width:12px;height:12px}
.jp-step-body{flex:1;min-width:0;display:grid;grid-template-columns:1fr auto;column-gap:8px;align-items:baseline}
.jp-step-label{padding-top:2px;line-height:1.35;min-width:0}
/* The percent of each step: 100% when done, the count of the current one while it runs. */
.jp-step-pct{font-size:12px;font-weight:650;color:var(--muted);font-variant-numeric:tabular-nums}
.jp-steps li.current .jp-step-pct{color:var(--rev)}
.jp-step-bar{grid-column:1 / -1;height:4px;margin:6px 0 2px;border-radius:2px;background:var(--surface-3);overflow:hidden;position:relative}
.jp-step-bar span{display:block;height:100%;border-radius:2px;background:var(--rev);transition:width .6s ease}
.jp-step-bar.indeterminate span{position:absolute;width:30%;animation:jp-step-slide 1.4s ease-in-out infinite}
@keyframes jp-step-slide{0%{left:-30%}100%{left:100%}}
.jp-step-text{grid-column:1 / -1;font-size:12px;font-weight:400;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (prefers-reduced-motion:reduce){.jp-step-bar.indeterminate span{animation:none;left:0}}
.jp-steps li.done{color:var(--fg)}
.jp-steps li.done .jp-mark{background:var(--ok);border-color:var(--ok);color:var(--on-ok)}
.jp-steps li.current{color:var(--fg);font-weight:650}
.jp-steps li.current .jp-mark{background:var(--rev);border-color:var(--rev);color:#fff;animation:jp-pulse 1.6s ease-out infinite}
@keyframes jp-pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--rev) 55%,transparent)}100%{box-shadow:0 0 0 9px transparent}}
.jp-steps li.failed{color:var(--bad);font-weight:650}
.jp-steps li.failed .jp-mark{background:var(--bad);border-color:var(--bad);color:#fff}

/* The routes a preparation is working on. */
.prep-routes{list-style:none;margin:2px 0 0;padding:0;display:flex;flex-direction:column;gap:10px}
.prep-routes li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center;font-size:13px}
.prep-routes .bar{grid-column:1/-1;height:6px}
.prep-route{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prep-phase{color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}

/* Prepare, Train: the card with the figure and the actions. */
.tab-card{display:flex;flex-direction:column;gap:16px}
.tab-card h2{margin:0 0 6px}
.tab-card-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px}
.figure{font-size:26px;font-weight:750;letter-spacing:-.02em;line-height:1.15;font-variant-numeric:tabular-nums}
.figure-unit{margin-left:8px;font-size:15px;font-weight:500;letter-spacing:0;color:var(--muted)}
.figure-note{margin:4px 0 0;color:var(--muted);font-size:13.5px}
.chips{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:8px}
.chips li{padding:4px 12px;border-radius:999px;background:var(--todo-soft);color:var(--todo);font-size:13px}
.numbers{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.number{display:flex;flex-direction:column;gap:8px}
.number h2{margin:0}
.number .figure-note{margin:0}
.goal{display:flex;gap:4px}
.goal span{flex:1;height:8px;border-radius:4px;background:var(--surface-3)}
.goal span.on{background:var(--ok)}

/* The sparklines (components/Spark.vue). */
.spark{height:44px;margin:10px 0 6px;border-radius:8px;background:var(--surface-2);overflow:hidden}
.spark svg{width:100%;height:100%;display:block}
.job-item .sub{overflow-wrap:anywhere}
.job-item .pill{min-width:92px;justify-content:center}
.gpu-procs{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.gpu-procs li{display:flex;align-items:center;gap:10px;font-size:13.5px}
.gpu-procs .grow{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.side .note{margin:10px 0 0}

/* How a training is going (TrainingCharts.vue, charts/LineChart.vue): train blue, validation orange, the two
   first slots of the reference categorical palette of the dataviz method, validated on both surfaces. */
:root{--c-train:#3987e5;--c-val:#d95926}
:root[data-theme="light"]{--c-train:#2a78d6;--c-val:#eb6834}
@media (prefers-color-scheme:light){:root[data-theme="auto"]{--c-train:#2a78d6;--c-val:#eb6834}}
.training{display:flex;flex-direction:column;gap:18px}
.training>h2{margin:0}
.training-wait{display:flex;align-items:center;gap:16px;color:var(--muted)}
.training-wait svg{width:72px;height:48px;flex:none;color:var(--line-strong)}
.training-wait p{margin:0;display:flex;flex-direction:column;gap:2px;font-size:14px}
.training-wait strong{color:var(--fg);font-weight:600;font-size:15px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.tile{display:flex;flex-direction:column;gap:2px;min-width:0;padding:12px 14px;border-radius:14px;background:var(--surface-2);border:1px solid var(--line)}
.tile-label{font-size:12.5px;color:var(--muted)}
.tile-value{font-size:24px;font-weight:700;letter-spacing:-.02em;line-height:1.25}
.tile-value small{font-size:14px;font-weight:500;letter-spacing:0;color:var(--muted)}
.tile-note{font-size:12.5px;color:var(--muted)}
.net{display:flex;flex-direction:column;gap:10px;padding-top:16px;border-top:1px solid var(--line)}
.net h3{margin:0;display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 10px;font-size:16px;font-weight:700}
.net h3 span{font-size:13px;font-weight:400;color:var(--muted)}
.net-wait{margin:0;padding:18px;border-radius:14px;border:1px dashed var(--line-strong);color:var(--muted);font-size:14px;text-align:center}
.net-charts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px 28px}
.chart{margin:0;min-width:0;padding:12px 14px 6px;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
.chart-head{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:4px 14px;margin-bottom:4px}
.chart-title{font-size:13px;font-weight:600}
.chart-legend{display:flex;gap:14px;font-size:12.5px;color:var(--muted)}
.chart-key{display:inline-flex;align-items:center;gap:6px}
.chart-swatch{width:14px;height:2px;border-radius:1px}
.chart-plot{position:relative;min-width:0;border-radius:10px;touch-action:pan-y;cursor:crosshair}
.chart-plot svg{display:block;max-width:100%;overflow:visible}
.chart-grid line{stroke:var(--grid);stroke-width:1}
.chart-axis text,.chart-now text,.chart-best text,.chart-end{font-size:11px;fill:var(--muted);font-variant-numeric:tabular-nums}
.chart-best text,.chart-end{fill:var(--fg);font-weight:600}
.chart-now rect{fill:var(--accent-soft)}
.chart-line{fill:none;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.chart-dot{stroke:var(--surface);stroke-width:2}
.chart-best circle{fill:none;stroke-width:1.5}
.chart-best text{paint-order:stroke;stroke:var(--surface);stroke-width:4px;stroke-linejoin:round}
.chart-cross{stroke:var(--line-strong);stroke-width:1}
.chart-empty{position:absolute;inset:16px 64px 26px 46px;display:grid;place-items:center;color:var(--muted);font-size:13px}
.chart-tip{position:absolute;top:6px;z-index:2;min-width:132px;padding:8px 10px;border-radius:10px;pointer-events:none;
background:var(--surface);border:1px solid var(--line-strong);box-shadow:var(--tip-shadow);font-size:12.5px;transform:translateX(12px)}
.chart-tip.flip{transform:translateX(calc(-100% - 12px))}
.chart-tip-head{margin-bottom:4px;color:var(--muted)}
.chart-tip-row{display:flex;align-items:center;gap:8px;white-space:nowrap}
.chart-tip-row strong{min-width:46px;font-variant-numeric:tabular-nums}
.chart-tip-row span:last-child{color:var(--muted)}
.chart-tip-key{width:12px;height:2px;border-radius:1px;flex:none}
.chart-table summary{cursor:pointer;width:max-content;color:var(--muted);font-size:13.5px}
.chart-table summary:hover{color:var(--fg)}
.chart-table table{margin-top:6px;font-size:13px}
.chart-table caption{padding:10px 0 4px;text-align:left;font-weight:600}
.chart-table th,.chart-table td{padding:6px 10px}

/* The actions (ActionList.vue): one card each, the whole card the button: icon, label, one sentence, and why
   not now (amber) when it cannot start; a dashed outline when it is off. */
.acts{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:10px}
.act{display:flex;min-width:0}
.act-card{appearance:none;font:inherit;color:inherit;text-align:left;width:100%;display:flex;align-items:flex-start;gap:14px;
padding:14px 16px;border-radius:16px;border:1px solid var(--line-strong);background:var(--surface-2);cursor:pointer;min-height:76px;
transition:border-color .2s,background .2s,box-shadow .2s,transform .1s}
.act-card:hover:not(:disabled){border-color:var(--accent);background:var(--surface-3);box-shadow:0 0 0 3px var(--accent-soft)}
.act-card:active:not(:disabled){transform:scale(.99)}
.act-icon{width:42px;height:42px;border-radius:12px;flex:none;display:grid;place-items:center;background:var(--accent-soft);
color:var(--accent);box-shadow:inset 0 0 0 1px var(--tab-on-ring)}
.act-icon .icon{width:22px;height:22px}
.act-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.act-label{font-weight:700;font-size:15.5px;letter-spacing:-.005em}
.act-text{color:var(--muted);font-size:13.5px;line-height:1.4}
.act-reason{color:var(--todo);font-size:13px;line-height:1.4}
.act-go{align-self:center;color:var(--muted);font-size:17px;opacity:.6;transition:transform .2s,opacity .2s}
.act-card:hover:not(:disabled) .act-go{transform:translateX(3px);opacity:1;color:var(--accent)}
.act-card:disabled{cursor:not-allowed;background:transparent;border-style:dashed}
.act-card:disabled .act-icon{background:var(--surface-2);color:var(--muted);box-shadow:inset 0 0 0 1px var(--line)}
.act-card:disabled .act-label{color:var(--muted)}
.act-card:disabled .act-go{visibility:hidden}

/* Train a model (TrainStart.vue): where it starts, one card each (a small drawing, label, sentence, the
   reason when it is not available), then Start training. */
.train-start{display:flex;flex-direction:column;gap:14px;padding-top:16px;border-top:1px solid var(--line)}
.ts-head{display:flex;align-items:flex-start;gap:14px}
.ts-title{margin:0;font-size:15.5px;font-weight:700}
.ts-text{margin:3px 0 0;color:var(--muted);font-size:13.5px;max-width:80ch}
.starts{margin:0;padding:0;border:0;min-width:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:10px}
.ts-legend{padding:0;margin:0 0 10px;font-size:12px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.start{position:relative;display:flex;flex-direction:column;gap:12px;min-width:0;padding:14px;border-radius:16px;
border:1px solid var(--line-strong);background:var(--surface-2);cursor:pointer;transition:border-color .2s,box-shadow .2s,background .2s}
.start:hover{border-color:var(--hover-line)}
.start input{position:absolute;opacity:0;pointer-events:none}
.start.on{border-color:var(--accent);background:var(--card-grad),var(--surface);box-shadow:0 0 0 1px var(--accent),0 10px 28px var(--accent-soft)}
.start:has(input:focus-visible){outline:3px solid var(--focus);outline-offset:2px}
.start.off{cursor:not-allowed;background:transparent;border-style:dashed}
.start-art{width:48px;height:48px;border-radius:14px;flex:none;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent)}
.start-art .icon{width:28px;height:28px}
.start.off .start-art{background:var(--surface-2);color:var(--muted)}
.start-body{display:flex;flex-direction:column;gap:4px;min-width:0;padding-right:26px}
.start-label{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;font-weight:700;font-size:15px}
.start.off .start-label{color:var(--muted)}
.start-tag{padding:1px 8px;border-radius:999px;background:var(--ok-soft);color:var(--ok);font-size:11.5px;font-weight:600}
.start-text{color:var(--muted);font-size:13px;line-height:1.4}
.start-reason{display:inline-block;margin-top:4px;color:var(--todo)}
.start-check{position:absolute;top:12px;right:12px;width:26px;height:26px;border-radius:50%;background:var(--accent);color:#fff;
display:grid;place-items:center;opacity:0;transform:scale(.6);transition:opacity .2s,transform .2s}
.start-check svg{width:16px;height:16px}
.start.on .start-check{opacity:1;transform:none}
.ts-go{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px}
.ts-go .btn{min-width:220px}
.ts-go .btn.primary:disabled{opacity:1;background:var(--accent-soft);border-color:var(--tab-on-ring);color:var(--tab-on-fg);box-shadow:none}
.ts-go .reason{font-size:13px;color:var(--todo)}
.ts-from{margin:0;color:var(--muted);font-size:13.5px}
.ts-from strong{color:var(--fg);font-weight:600}
.figure-link{margin-left:4px;color:var(--rev);text-decoration:none;white-space:nowrap}
.figure-link:hover{text-decoration:underline;text-underline-offset:2px}

/* The review on the Overview: a tile of the flow, not a link (Resume review and All routes are). */
.flow-review{cursor:default}
.flow-review:hover{border-color:var(--line);background:var(--card-grad),var(--surface)}
.flow-review.attention:hover{border-color:color-mix(in srgb,var(--k) 55%,transparent)}
h2.flow-head{margin:0}
.flow-review .flow-head::after{content:none}
.flow-actions{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;margin-top:6px}
.flow-link{display:inline-flex;align-items:center;gap:6px;color:var(--rev);font-weight:600;font-size:14px;text-decoration:none}
.flow-link:hover{text-decoration:underline;text-underline-offset:3px}
.flow-link .icon{width:16px;height:16px}


/* What the dataset holds (DatasetSection.vue): figures, bar lists, the split as one stacked bar, the routes.
   The split takes the first five slots of the reference categorical palette (validated, both themes): train
   and validation are the blue and orange of the training charts. */
:root{--split-3:#199e70;--split-4:#c98500;--split-5:#d55181}
:root[data-theme="light"]{--split-3:#1baf7a;--split-4:#eda100;--split-5:#e87ba4}
@media (prefers-color-scheme:light){:root[data-theme="auto"]{--split-3:#1baf7a;--split-4:#eda100;--split-5:#e87ba4}}
.dataset{display:flex;flex-direction:column;gap:18px;scroll-margin-top:140px}
.ds-head{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:4px 12px}
.ds-head h2{margin:0}
.ds-when{margin-left:10px;font-size:12.5px;font-weight:500;letter-spacing:0;text-transform:none;color:var(--muted)}
.ds-head .ds-when{margin:0}
.ds-figures{display:flex;flex-wrap:wrap;gap:8px 32px}
.ds-figure{display:flex;align-items:baseline;gap:8px}
.ds-value{font-size:28px;font-weight:750;letter-spacing:-.02em;line-height:1.1;font-variant-numeric:tabular-nums}
.ds-unit{font-size:15px;color:var(--muted)}
.ds-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px 36px}
.ds-block{display:flex;flex-direction:column;gap:10px;min-width:0}
.dataset>.ds-grid,.dataset>.ds-block{padding-top:16px;border-top:1px solid var(--line)}
.ds-title{margin:0;display:flex;flex-wrap:wrap;align-items:baseline;font-size:13px;font-weight:600;letter-spacing:.05em;
text-transform:uppercase;color:var(--muted)}
.ds-block .ds-title:not(:first-child){margin-top:12px}
.barlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.barlist li{display:grid;grid-template-columns:minmax(96px,34%) minmax(0,1fr) 64px;align-items:center;gap:10px;font-size:13.5px}
.barlist.share li{grid-template-columns:minmax(96px,34%) minmax(0,1fr) 104px}
.bl-label{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bl-track{height:10px;border-radius:0 4px 4px 0;background:color-mix(in srgb,var(--surface-3) 70%,transparent)}
.bl-track span{display:block;height:100%;border-radius:0 4px 4px 0;background:var(--series)}
.bl-value{text-align:right;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.bl-value small{margin-left:6px;font-size:12px;font-weight:500;color:var(--muted)}
.ds-import p{margin:0;font-size:14px}
.ds-import .ds-warn{margin-top:8px;padding:10px 12px;border-radius:12px;font-size:13.5px;background:var(--warn-soft);
border:1px solid color-mix(in srgb,var(--warn) 35%,transparent)}
.split-bar{display:flex;gap:2px;height:16px;border-radius:5px;overflow:hidden}
.split-bar span{flex-basis:0;min-width:3px}
.split-1{background:var(--c-train)}.split-2{background:var(--c-val)}.split-3{background:var(--split-3)}
.split-4{background:var(--split-4)}.split-5{background:var(--split-5)}.split-0{background:var(--line-strong)}
.split-legend{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:6px 22px;font-size:13.5px}
.split-legend li{display:inline-flex;align-items:center;gap:7px}
.split-legend strong{font-weight:650;font-variant-numeric:tabular-nums}
.split-share{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.split-key{width:10px;height:10px;border-radius:3px;flex:none}
.dataset .note{margin:0;font-size:13px;max-width:90ch}
.ds-routes{font-size:13.5px}
.ds-routes td,.ds-routes th{padding:8px 10px}
.ds-routes tfoot th,.ds-routes tfoot td{border-top:1px solid var(--line-strong);border-bottom:0;font-weight:650;color:var(--fg);
text-transform:none;letter-spacing:0;font-size:13.5px}

/* The details of a job in the sheet: a summary line, the steps, the log as plain text. */
.sheet-sub{margin:2px 0 0;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.sheet-section{margin:14px 0 8px;font-size:13px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.sheet .jp-steps{padding:10px 14px}

/* Pills: 'to review' neutral and 'to import' green, both with a hollow dot (not done yet). */
.pill.hollow::before{background:transparent;box-shadow:inset 0 0 0 1.5px currentColor}

/* Routes table: the route column has a fixed width, numbers right-aligned. */
.table-card{padding:18px 0 4px}
.table-card h2{padding:0 20px}
.table-card table{table-layout:fixed}
col.c-route{width:200px}
col.c-seg{width:100px}
col.c-frames{width:120px}
col.c-objects{width:124px}
col.c-state{width:228px}
.table-card th{overflow:hidden;text-overflow:ellipsis}
.table-card th:first-child,.table-card td:first-child{padding-left:20px}
.table-card th:last-child,.table-card td:last-child{padding-right:20px}
.table-card tbody tr:hover td{background:var(--accent-soft)}
.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
td.route{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
td.route a{font-family:var(--font-data);font-size:12.5px;color:var(--fg);text-decoration:none}
td.route a:hover{color:var(--rev);text-decoration:underline;text-underline-offset:2px}
td.none{color:var(--muted)}
/* Bar, then the count in a fixed right-aligned slot, so every bar ends at the same x. */
.reviewed{display:flex;align-items:center;gap:10px}
.reviewed .bar{flex:1;min-width:40px}
.reviewed .num{flex:none;width:11ch;font-size:12.5px;color:var(--muted)}
td .note{display:block;margin-top:4px;font-size:12px}
.table-card .empty{padding:0 20px 14px}

/* Evaluate (EvaluateTab.vue and its sections): the runs as a table (a row opens the run), the run in detail, the
   reader per label, the detector per sign size, the split, experiment B, two runs compared. Only the tokens of
   shared.css and the series colours above, so both themes follow. */
.muted{color:var(--muted)}
.runs-card,.eval-card,.run-detail{display:flex;flex-direction:column;gap:16px;min-width:0}
.runs-card{gap:12px}
.runs-card .count-badge{margin-left:8px;vertical-align:1px}
.eval-card>.ds-block{padding-top:16px;border-top:1px solid var(--line)}
.eval-what{margin-left:10px;font-size:13px;font-weight:400;letter-spacing:0;text-transform:none;color:var(--muted)}
.run-empty{display:flex;align-items:center;gap:14px}
.run-empty .idle-icon{background:var(--accent-soft);color:var(--accent)}
.run-empty .flow-link{margin-top:6px;width:max-content}
.runs{font-size:13.5px}
.runs th,.runs td{padding:10px}
.runs td{vertical-align:top}
.runs tbody tr{cursor:pointer}
.runs tbody tr:hover td{background:var(--surface-2)}
.runs tbody tr.on td{background:var(--accent-soft)}
.runs tbody tr.on td:first-child{box-shadow:inset 3px 0 0 var(--accent)}
.run-name{appearance:none;border:0;background:none;padding:0;font:inherit;font-weight:650;color:var(--fg);cursor:pointer;
font-variant-numeric:tabular-nums;text-align:left;border-radius:4px}
.run-name:hover{color:var(--rev)}
.run-sub{display:block;margin-top:2px;font-size:12px;font-weight:400;color:var(--muted);white-space:normal}
.runs td.num .run-sub{white-space:nowrap}
.runs .pill{margin-bottom:1px}
.run-none{color:var(--muted);font-size:13px}
.run-detail{scroll-margin-top:140px}
.rd-head{display:flex;align-items:center;justify-content:space-between;gap:12px}
.rd-title{display:flex;flex-direction:column;gap:1px;min-width:0}
.run-detail .rd-title h2{margin:0;font-size:22px;font-weight:700;letter-spacing:-.01em;text-transform:none;color:var(--fg);
font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.rd-where{margin:0;font-size:14.5px;font-weight:600}
.rd-where.running{color:var(--rev)}.rd-where.finished{color:var(--ok)}.rd-where.incomplete{color:var(--warn)}
.rd-error{margin:0}
.rd-error code{display:block;padding:8px 10px;white-space:pre-wrap;word-break:break-word;border-color:var(--error-line)}
.run-detail>.note{margin:0}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px 24px;margin:0}
.facts>div{min-width:0}
.facts dt{font-size:12px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.facts dd{margin:3px 0 0;font-size:14px;overflow-wrap:anywhere}
.route-code{display:inline-block;margin:0 6px 4px 0}
/* A choice of two or three (Segmented.vue), marked as the tabs of the top bar. */
.seg{display:inline-flex;flex-wrap:wrap;gap:4px;padding:4px;width:max-content;max-width:100%;background:var(--surface-2);
border:1px solid var(--line);border-radius:12px}
.seg button{appearance:none;border:0;background:none;color:var(--muted);font:inherit;font-weight:600;font-size:13px;padding:5px 12px;
border-radius:9px;cursor:pointer;min-height:32px}
.seg button:hover{color:var(--fg)}
.seg button[aria-checked="true"]{color:var(--tab-on-fg);background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--tab-on-ring)}
.seg-row{display:flex;flex-wrap:wrap;gap:8px 12px}
.eval-list{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.eval-row{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1.2fr) minmax(0,1.4fr);gap:4px 16px;align-items:baseline;padding:12px 14px;border:1px solid var(--line);border-radius:12px;cursor:pointer}
.eval-row:hover{border-color:var(--line-strong)}
.eval-row.picked{border-color:var(--accent);background:var(--accent-soft)}
.eval-name{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 8px}
.eval-when{color:var(--muted);font-size:12.5px;font-weight:400}
.eval-main{font-weight:650;font-variant-numeric:tabular-nums}
.eval-main.top{color:var(--good,#22c55e)}
.eval-second{color:var(--muted);font-size:13px;display:flex;flex-wrap:wrap;gap:2px 12px}
.in-use{padding:1px 8px;border-radius:999px;font-size:11.5px;font-weight:650;border:1px solid currentColor;color:var(--accent);white-space:nowrap}
.eval-vs{font-size:12.5px}
.eval-vs.better{color:var(--good,#22c55e)}.eval-vs.worse{color:var(--bad)}.eval-vs.same{color:var(--muted)}
@media (max-width:800px){.eval-row{grid-template-columns:1fr}.eval-main{font-size:17px}.eval-head .seg{display:grid;grid-template-columns:repeat(4,auto);width:100%}.eval-head .seg button{padding-left:6px;padding-right:6px}}
.eval-more>summary{cursor:pointer;font-weight:650}
.proposer{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin:14px 0 10px}
.proposer-label{font-weight:650;font-size:14px}
.proposer .figure-note{flex:1 0 100%}
.proposer .proposer-missing{color:var(--bad)}
</style>
</head>
<body>
__NNSLR_TOPBAR__

<div id="app"></div>
__NNSLR_SCRIPT__
</body>
